<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="1600" cy="150" r="80" fill="url(#sunGrad)" filter="url(#glow)"/>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Ground -->
  <rect y="600" width="1920" height="480" fill="url(#ground)"/>
  <!-- Solar panel rows -->
  <g fill="#0f172a" stroke="#3b82f6" stroke-width="2" opacity="0.8">
    <rect x="100" y="650" width="1720" height="60" rx="4"/>
    <rect x="100" y="730" width="1720" height="60" rx="4"/>
    <rect x="100" y="810" width="1720" height="60" rx="4"/>
    <rect x="100" y="890" width="1720" height="60" rx="4"/>
  </g>
  <!-- Panel details -->
  <g stroke="#1e40af" stroke-width="1" opacity="0.5">
    <line x1="100" y1="680" x2="1820" y2="680"/>
    <line x1="100" y1="760" x2="1820" y2="760"/>
    <line x1="100" y1="840" x2="1820" y2="840"/>
    <line x1="100" y1="920" x2="1820" y2="920"/>
  </g>
  <!-- Reflection on panels -->
  <g fill="url(#sunGrad)" opacity="0.1">
    <rect x="100" y="650" width="1720" height="15" rx="4"/>
    <rect x="100" y="730" width="1720" height="15" rx="4"/>
    <rect x="100" y="810" width="1720" height="15" rx="4"/>
    <rect x="100" y="890" width="1720" height="15" rx="4"/>
  </g>
</svg>
