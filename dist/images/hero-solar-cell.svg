<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="url(#cellGrad)"/>
  <!-- Grid lines -->
  <g stroke="#1e3a8a" stroke-width="1" opacity="0.4">
    <line x1="64" y1="64" x2="448" y2="64"/>
    <line x1="64" y1="160" x2="448" y2="160"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="352" x2="448" y2="352"/>
    <line x1="64" y1="448" x2="448" y2="448"/>
    <line x1="64" y1="64" x2="64" y2="448"/>
    <line x1="160" y1="64" x2="160" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="352" y1="64" x2="352" y2="448"/>
    <line x1="448" y1="64" x2="448" y2="448"/>
  </g>
  <!-- Busbars -->
  <rect x="64" y="40" width="384" height="8" rx="4" fill="#1e3a8a" opacity="0.6"/>
  <rect x="64" y="464" width="384" height="8" rx="4" fill="#1e3a8a" opacity="0.6"/>
  <!-- Shine overlay -->
  <rect width="512" height="512" rx="48" fill="url(#shine)" style="animation: shine 3s ease-in-out infinite;"/>
  <style>
    @keyframes shine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  </style>
</svg>
